[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdm-digital-twin"
version = "0.1.0"
description = "Prescriptive digital twin for predictive maintenance on the Azure PdM dataset."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Saurav Bhowmick" }]
dependencies = [
    "pandas>=2.1,<3.0",
    "numpy>=1.26,<3.0",
    "scikit-learn>=1.4,<2.0",
    "lightgbm>=4.3,<5.0",
    "joblib>=1.3",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "pydantic>=2.5,<3.0",
    "typer>=0.12",
    "rich>=13.7",
    "mlflow>=2.12,<3.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
pdm-twin = "pdm.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
